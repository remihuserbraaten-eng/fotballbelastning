<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test – Rediger økt</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 520px; margin: 0 auto; padding: 20px; background: #020617; color: #f8fafc; }
    .card { margin: 12px 0; padding: 18px; border: 1px solid #334155; border-radius: 16px; background: #0f172a; }
    label { display: block; margin: 10px 0 5px; color: #94a3b8; font-size: 12px; font-weight: 700; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 12px; background: #020617; color: white; }
    input[type="range"] { padding: 4px; accent-color: #10b981; }
    button { border: 0; margin-top: 12px; background: #10b981; color: #022c22; font-weight: 800; cursor: pointer; }
    button.secondary { background: #334155; color: white; }
    button.danger { background: #7f1d1d; color: #fecaca; }
    .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .row button { width: auto; margin: 0; padding: 8px 10px; }
    .muted { color: #94a3b8; font-size: 12px; }
    .warning { border: 1px solid #a16207; background: #422006; color: #fde68a; }
  </style>
</head>
<body>
  <div class="card warning">
    <strong>TESTMODUS</strong><br>
    <span class="muted">Fiktiv deltaker: <strong>Testdeltaker</strong>. Ingen Firebase eller produksjonsdata.</span>
  </div>

  <div class="card">
    <h2 id="formTitle">Registrer testøkt</h2>
    <form id="sessionForm">
      <input type="hidden" id="editingId">
      <label for="date">Dato</label>
      <input id="date" type="date" required>
      <label for="duration">Varighet (minutter)</label>
      <input id="duration" type="number" min="1" max="240" required>
      <label for="activity">Aktivitet</label>
      <select id="activity">
        <option>Klubbtrening</option>
        <option>Kamp</option>
        <option>Egentrening</option>
        <option>Alternativ</option>
        <option>Gym</option>
        <option>Hviledag / Rolig dag</option>
      </select>
      <label for="rpe">RPE: <span id="rpeValue">5</span></label>
      <input id="rpe" type="range" min="1" max="10" value="5">
      <button id="saveButton" type="submit">Lagre testøkt</button>
      <button id="cancelButton" type="button" class="secondary" hidden>Avbryt redigering</button>
    </form>
  </div>

  <div class="card">
    <h2>Testøkter</h2>
    <div id="sessionList" class="muted">Ingen økter enda.</div>
  </div>

  <script>
    const STORAGE_KEY = 'fotball_test_sessions';
    const TEST_PLAYER = { token: 'test-fiktiv-deltaker', name: 'Testdeltaker' };

    const getSessions = () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch (error) { return []; }
    };

    const saveSessions = (sessions) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    };

    const dateInput = document.getElementById('date');
    const durationInput = document.getElementById('duration');
    const activityInput = document.getElementById('activity');
    const rpeInput = document.getElementById('rpe');
    const rpeValue = document.getElementById('rpeValue');
    const editingId = document.getElementById('editingId');
    const formTitle = document.getElementById('formTitle');
    const saveButton = document.getElementById('saveButton');
    const cancelButton = document.getElementById('cancelButton');

    dateInput.valueAsDate = new Date();

    rpeInput.addEventListener('input', () => {
      rpeValue.textContent = rpeInput.value;
    });

    function resetForm() {
      editingId.value = '';
      formTitle.textContent = 'Registrer testøkt';
      saveButton.textContent = 'Lagre testøkt';
      cancelButton.hidden = true;
      dateInput.valueAsDate = new Date();
      durationInput.value = '';
      activityInput.value = 'Klubbtrening';
      rpeInput.value = 5;
      rpeValue.textContent = '5';
    }

    window.editSession = function(id) {
      const session = getSessions().find((item) => item.id === id);
      if (!session) return;

      editingId.value = id;
      formTitle.textContent = 'Rediger testøkt';
      saveButton.textContent = 'Oppdater testøkt';
      cancelButton.hidden = false;
      dateInput.value = session.date;
      durationInput.value = session.duration;
      activityInput.value = session.activity;
      rpeInput.value = session.rpe;
      rpeValue.textContent = session.rpe;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteSession = function(id) {
      if (!confirm('Vil du slette denne testøkten?')) return;
      saveSessions(getSessions().filter((item) => item.id !== id));
      resetForm();
      renderSessions();
    };

    cancelButton.addEventListener('click', resetForm);

    document.getElementById('sessionForm').addEventListener('submit', (event) => {
      event.preventDefault();

      const date = dateInput.value;
      const duration = Number(durationInput.value);
      const activity = activityInput.value;
      const rpe = Number(rpeInput.value);

      if (!date || !duration) {
        alert('Fyll ut dato og varighet.');
        return;
      }

      const srpe = activity === 'Hviledag / Rolig dag' ? 0 : duration * rpe;
      let sessions = getSessions();

      if (editingId.value) {
        sessions = sessions.map((item) => item.id === editingId.value
          ? { ...item, date, duration, activity, rpe, srpe }
          : item);
      } else {
        sessions.push({
          id: 'test_' + Date.now(),
          playerToken: TEST_PLAYER.token,
          playerName: TEST_PLAYER.name,
          date,
          duration,
          activity,
          rpe,
          srpe
        });
      }

      saveSessions(sessions);
      resetForm();
      renderSessions();
    });

    function renderSessions() {
      const container = document.getElementById('sessionList');
      const sessions = getSessions()
        .filter((item) => item.playerToken === TEST_PLAYER.token)
        .sort((a, b) => b.date.localeCompare(a.date));

      if (!sessions.length) {
        container.className = 'muted';
        container.textContent = 'Ingen økter enda.';
        return;
      }

      container.className = '';
      container.innerHTML = sessions.map((session) => `
        <div class="card row">
          <div>
            <strong>${session.activity}</strong><br>
            <span class="muted">${session.date} • ${session.duration} min • RPE ${session.rpe} • ${session.srpe} sRPE</span>
          </div>
          <button type="button" onclick="editSession('${session.id}')">Rediger</button>
          <button type="button" class="danger" onclick="deleteSession('${session.id}')">Slett</button>
        </div>
      `).join('');
    }

    renderSessions();
  </script>
</body>
</html>
