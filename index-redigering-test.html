<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotballbelastning – full testapp med øktredigering</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #020617; color: #e2e8f0; font: 14px system-ui, sans-serif; }
    .notice { padding: 12px 16px; background: #422006; border-bottom: 1px solid #a16207; color: #fde68a; }
    .notice strong { color: #fef3c7; }
    .notice p { margin: 4px 0 0; }
    iframe { display: block; width: 100%; height: calc(100vh - 76px); min-height: 700px; border: 0; background: #020617; }
  </style>
</head>
<body>
  <aside class="notice">
    <strong>TESTMODUS – full app med fiktiv deltaker «Testdeltaker»</strong>
    <p>Dette er hele appen. Testøkter bruker en lokal testtoken, ikke en ekte deltakerlenke. Endringer lagres bare i nettleseren; Firebase-skriving er slått av for testøkter.</p>
  </aside>
  <iframe id="app" title="Fotballbelastning testapp"></iframe>

  <script>
    (() => {
      const testToken = 'test-fiktiv-deltaker';
      const tokenStorageKey = 'fotball_load_tokens';
      try {
        const tokens = JSON.parse(localStorage.getItem(tokenStorageKey) || '{}');
        tokens[testToken] = 'Testdeltaker';
        localStorage.setItem(tokenStorageKey, JSON.stringify(tokens));
      } catch (error) {
        localStorage.setItem(tokenStorageKey, JSON.stringify({ [testToken]: 'Testdeltaker' }));
      }

      const frame = document.getElementById('app');
      frame.src = './index.html?token=' + encodeURIComponent(testToken) + '&testMode=1';

      frame.addEventListener('load', () => {
        let appWindow;
        let appDocument;
        try {
          appWindow = frame.contentWindow;
          appDocument = frame.contentDocument;
          // Confirm the iframe is same-origin before adding test-only controls.
          void appDocument.body;
        } catch (error) {
          return;
        }

        const originalLoadRecentSessions = appWindow.loadRecentSessions;
        if (typeof originalLoadRecentSessions !== 'function') return;

        function addEditButtons() {
          const list = appDocument.getElementById('recentSessionsList');
          if (!list) return;

          let sessions = [];
          try {
            sessions = JSON.parse(appWindow.localStorage.getItem('fotball_load_sessions') || '[]')
              .filter(session => session.playerToken === testToken)
              .sort((a, b) => new Date(b.date) - new Date(a.date));
          } catch (error) {
            return;
          }

          Array.from(list.children).forEach((row, index) => {
            const session = sessions[index];
            if (!session || row.querySelector('[data-test-edit]')) return;
            const button = appDocument.createElement('button');
            button.type = 'button';
            button.dataset.testEdit = 'true';
            button.textContent = 'Rediger';
            button.className = 'ml-2 shrink-0 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 text-[10px] font-bold text-emerald-300';
            button.addEventListener('click', () => {
              appDocument.getElementById('editingSessionId').value = session.id || session.timestamp;
              appDocument.getElementById('sessionDate').value = session.date || '';
              appDocument.getElementById('duration').value = session.duration ?? '';
              appDocument.getElementById('activityType').value = session.activity || 'Klubbtrening';
              appDocument.getElementById('rpeScore').value = session.rpe || 5;
              appWindow.updateRpeDisplay(String(session.rpe || 5));
              appDocument.getElementById('sleepHours').value = session.sleep || '';
              appDocument.getElementById('bodyStatus').value = session.body || 'Alt topp';
              appDocument.getElementById('formHeaderTitle').textContent = 'Rediger testøkt';
              appDocument.getElementById('btnSave').textContent = 'Oppdater testøkt';
              appDocument.getElementById('btnCancelEdit').classList.remove('hidden');
              appDocument.getElementById('sessionForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
              appWindow.calculateLiveSrpe();
            });
            row.appendChild(button);
          });
        }

        appWindow.loadRecentSessions = function(token) {
          originalLoadRecentSessions(token);
          if (token === testToken) addEditButtons();
        };

        // Render once now; future app refreshes use the wrapped function above.
        appWindow.loadRecentSessions(testToken);
      });
    })();
  </script>
</body>
</html>
